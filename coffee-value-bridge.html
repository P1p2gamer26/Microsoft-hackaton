/* ---------- SCORING ENGINES (fórmulas transparentes) ---------- */
const MOS_W = {size:0.20, trend:0.18, growth:0.14, unitVal:0.14, comp:0.12, barriers:0.10, logi:0.07, risk:0.05};
function marketScore(m){
  const s = m.size*MOS_W.size + m.trend*MOS_W.trend + m.growth*MOS_W.growth +
            m.unitVal*MOS_W.unitVal + (100-m.comp)*MOS_W.comp + (100-m.barriers)*MOS_W.barriers +
            m.logi*MOS_W.logi + (100-m.risk)*MOS_W.risk;
  return Math.round(s);
}
// Buyer Match: compara comprador vs producto
function buyerMatch(buyer, prod){
  let parts=[], total=0, wsum=0;
  const add=(label,w,val)=>{parts.push({label,w,val:Math.round(val)});total+=val*w;wsum+=w;};
  add("Tipo de producto",0.25, buyer.wants===prod.form?100:25);
  add("Segmento",0.18, buyer.seg===prod.segment?100:(Math.abs(segIdx(buyer.seg)-segIdx(prod.segment))<=1?60:30));
  const volFit = prod.kg>=buyer.volKg?100:Math.round(prod.kg/buyer.volKg*100);
  add("Volumen / abasto",0.20, Math.min(100,volFit));
  const pr = buyer.targetPrice? Math.max(0,100-Math.abs(prod.price-buyer.targetPrice)/buyer.targetPrice*180):50;
  add("Precio objetivo",0.17, pr);
  const certOk = buyer.certsReq.length===0?70:Math.round(buyer.certsReq.filter(c=>prod.certs.includes(c)).length/buyer.certsReq.length*100);
  add("Certificaciones",0.12, certOk);
  add("Verificación de datos",0.08, buyer.verified?100:40);
  return {score:Math.round(total/wsum), parts};
}
function segIdx(s){return ["Comercial premium","Marca propia","Especialidad"].indexOf(s);}

/* ---------- COST / COTIZADOR ENGINE ---------- */
function quote(cfg){
  // cfg: {materiaPrima, transformacion, merma, empaque, etiquetado, almacenamiento,
  //       transpInterno, fleteIntl, seguro, documentacion, arancelPct, distribucion, comisionPct, precioVenta, kg}
  const unit = {};
  unit.materiaPrima=cfg.materiaPrima;
  unit.transformacion=cfg.transformacion;
  unit.merma = cfg.materiaPrima*(cfg.merma/100);
  unit.empaque=cfg.empaque; unit.etiquetado=cfg.etiquetado; unit.almacenamiento=cfg.almacenamiento;
  unit.transpInterno=cfg.transpInterno; unit.fleteIntl=cfg.fleteIntl; unit.seguro=cfg.seguro;
  unit.documentacion=cfg.documentacion;
  const subtotal = unit.materiaPrima+unit.transformacion+unit.merma+unit.empaque+unit.etiquetado+
    unit.almacenamiento+unit.transpInterno+unit.fleteIntl+unit.seguro+unit.documentacion;
  unit.arancel = cfg.precioVenta*(cfg.arancelPct/100);
  unit.distribucion=cfg.distribucion;
  unit.comision = cfg.precioVenta*(cfg.comisionPct/100);
  const totalCost = subtotal+unit.arancel+unit.distribucion+unit.comision;
  const mBruto = cfg.precioVenta-subtotal;          // margen bruto (antes de costos comerciales)
  const mContrib = cfg.precioVenta-totalCost;        // margen de contribución
  return {unit,subtotal,totalCost,mBruto,mContrib,
    mBrutoPct:(mBruto/cfg.precioVenta*100),mContribPct:(mContrib/cfg.precioVenta*100),
    ingresos:cfg.precioVenta*cfg.kg, utilidad:mContrib*cfg.kg, capital:subtotal*cfg.kg};
}

/* ---------- TIME TO MARKET ---------- */
const CYCLE=[
  ["disp","Disponible"],["pub","Publicado"],["firstOpp","1ª oportunidad"],["qbuyer","Comprador calificado"],
  ["contact","1er contacto"],["resp","1ª respuesta"],["sample","Muestra"],["quote","Cotización"],
  ["order","Pedido"],["dispatch","Despacho"]
];
function daysBetween(a,b){if(!a||!b)return null;return Math.round((new Date(b)-new Date(a))/864e5);}
function oppMetrics(o){
  const e=o.events;
  return {
    toFirstOpp:daysBetween(e.pub,e.firstOpp),
    toQBuyer:daysBetween(e.firstOpp,e.qbuyer),
    toContact:daysBetween(e.qbuyer,e.contact),
    toResp:daysBetween(e.contact,e.resp),
    toQuote:daysBetween(e.resp||e.sample,e.quote),
    total:daysBetween(e.disp, e.order||e.quote||e.sample||e.contact)
  };
}
function staleDays(o){ if(o.stage==="Venta cerrada"||o.stage==="Operación perdida")return 0;
  return daysBetween(o.lastActivity,"2026-11-27"); }

/* ---------- HELPERS ---------- */
const $=s=>document.querySelector(s);
const money=n=>"$"+Math.round(n).toLocaleString("en-US");
const money2=n=>"$"+n.toFixed(2);
function scoreColor(s){return s>=70?"var(--green)":s>=50?"var(--amber)":"var(--terra)";}
function barHtml(s){return `<span class="score"><span class="bar"><i style="width:${s}%;background:${scoreColor(s)}"></i></span><b>${s}</b></span>`;}
function prodById(id){return DB.products.find(p=>p.id===id)}
function buyerById(id){return DB.buyers.find(b=>b.id===id)}
function flags(arr){return `<div class="inline-flags">${arr.map(f=>`<span class="flag ${f[0]}">${f[1]}</span>`).join("")}</div>`}

    <h3>Desglose · ${b.name} ↔ ${p.name}</h3>

VIEWS.ttm=function(){
  const closed=DB.opps.filter(o=>oppMetrics(o).total!=null);
  const avg=(f)=>{const v=DB.opps.map(f).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):"—";};
  const kpis=[
    ["Time to First Opportunity",avg(o=>oppMetrics(o).toFirstOpp),"publicado → 1ª oportunidad"],
    ["Time to Qualified Buyer",avg(o=>oppMetrics(o).toQBuyer),"oportunidad → comprador calificado"],
    ["Time to First Contact",avg(o=>oppMetrics(o).toContact),"calificado → contacto"],
    ["Time to First Response",avg(o=>oppMetrics(o).toResp),"contacto → respuesta"],
    ["Time to First Quote",avg(o=>oppMetrics(o).toQuote),"respuesta → cotización"],
    ["Total Time to Market",avg(o=>oppMetrics(o).total),"disponible → pedido"],
  ];
  // bottleneck: etapa con más días promedio
  const stageAvg=[
    ["1ª oportunidad",avg(o=>oppMetrics(o).toFirstOpp)],
    ["Comprador calificado",avg(o=>oppMetrics(o).toQBuyer)],
    ["Primer contacto",avg(o=>oppMetrics(o).toContact)],
    ["Respuesta",avg(o=>oppMetrics(o).toResp)],
    ["Cotización",avg(o=>oppMetrics(o).toQuote)],
  ].filter(x=>typeof x[1]==="number");
  const bottleneck=stageAvg.slice().sort((a,b)=>b[1]-a[1])[0];
  const maxd=Math.max(...stageAvg.map(x=>x[1]),1);
  const stale=DB.opps.filter(o=>staleDays(o)>=7);
  let html=`
  <div class="cards grid-3">${kpis.map(k=>`
    <div class="kpi"><div class="lab">${k[0]}</div><div class="val">${k[1]}<span class="mini"> días</span></div><div class="mini">${k[2]}</div></div>`).join("")}
  </div>
  <div class="cards grid-2" style="margin-top:14px">
    <div class="card">
      <h3>¿Dónde se pierde el tiempo?</h3>
      <div class="ch-sub">Promedio de días por etapa (DEMO)</div>
      ${stageAvg.map(s=>`<div style="margin:9px 0">
        <div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${s[0]}</span><b>${s[1]} días</b></div>
        <div class="bar" style="width:100%;height:9px;margin-top:4px"><i style="width:${s[1]/maxd*100}%;background:${s[0]===bottleneck[0]?'var(--terra)':'var(--green)'}"></i></div>
      </div>`).join("")}
      <div class="note" style="margin-top:10px"><span class="i">🎯</span><div>Cuello de botella detectado: <b>${bottleneck[0]}</b> (${bottleneck[1]} días promedio). Es la etapa a optimizar para reducir el tiempo total de comercialización.</div></div>
    </div>
    <div class="card">
      <h3>Oportunidades estancadas</h3>
      <div class="ch-sub">Umbral configurable · actualmente ≥7 días sin actividad</div>
      ${stale.map(o=>{const b=buyerById(o.buyer);return `<div class="note" style="margin-bottom:9px"><span class="i">⏱</span>
        <div><b>${o.id} · ${b.name}</b>: ${staleDays(o)} días sin actividad en «${o.stage}»${o.nextTask?"":", sin próxima tarea"}.</div></div>`}).join("")||'<div class="mini">Sin oportunidades estancadas.</div>'}
      <div class="divider"></div>
      <div class="mini">La distinción clave: el <b>tiempo de búsqueda/negociación</b> (lo que mide esta plataforma) <b>no</b> es el tiempo de tránsito internacional. Son métricas separadas.</div>
    </div>
  </div>`;
  $("#view").innerHTML=html;
};

const COPILOT_Q=[
  "¿Qué mercados debería priorizar?",
  "¿Qué compradores son más compatibles con mi Huila especialidad?",
  "¿Qué oportunidades están estancadas?",
  "¿Conviene exportar verde o tostado?",

let CHAT=[{r:"a",t:"Soy tu analista comercial. Trabajo <b>solo</b> con los datos registrados en tu cuenta (DEMO) y con reglas transparentes. No invento compradores, precios ni estadísticas; cuando falta información, lo digo. ¿En qué te ayudo?",prov:"Fuente: datos internos DEMO · motor de reglas v0"}];
VIEWS.copilot=function(){
  let html=`
  <div class="card">
    <div class="chat" id="chat">${CHAT.map(m=>`<div class="msg ${m.r}">${m.t}${m.prov?`<div class="prov">${m.prov}</div>`:""}</div>`).join("")}</div>
    <div class="suggest" style="margin-top:14px">${COPILOT_Q.map(q=>`<button onclick="ask(\`${q}\`)">${q}</button>`).join("")}</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <input id="chatInput" placeholder="Escribe una pregunta sobre tu negocio…" onkeydown="if(event.key==='Enter')ask(this.value)">
      <button class="btn" onclick="ask($('#chatInput').value)">Enviar</button>
    </div>
  </div>
  <div class="note" style="margin-top:14px"><span class="i">ℹ️</span><div>Este copiloto es un <b>motor de reglas</b> sobre tus datos, no un modelo que decide por ti. Diferencia hechos, cálculos y recomendaciones, y cita la fuente. No ejecuta acciones comerciales sin tu autorización.</div></div>`;
  $("#view").innerHTML=html;
};
function ask(q){
  if(!q||!q.trim())return;
  CHAT.push({r:"u",t:q});
  CHAT.push(answer(q));
  VIEWS.copilot();
  setTimeout(()=>{const c=$("#chat");if(c)c.scrollTop=c.scrollHeight;},10);
}
function answer(q){
  const l=q.toLowerCase();
  if(l.includes("mercado")){
    const top=DB.markets.map(m=>({m,s:marketScore(m)})).sort((a,b)=>b.s-a.s).slice(0,3);
    return {r:"a",t:`Según el Market Opportunity Score, prioriza: ${top.map((t,i)=>`<b>${i+1}. ${t.m.c}</b> (${t.s}/100)`).join(", ")}. ${top[0].m.c} destaca por tamaño y valor unitario; ${top.find(t=>t.m.growth>=80)?top.find(t=>t.m.growth>=80).m.c+" por crecimiento acelerado.":""}<br><span class="mini">Recomendación, no hecho. Falta confirmar precio FOB reciente y requisitos sanitarios por destino.</span>`,
      prov:"Fuente: indicadores de mercado DEMO · fórmula MOS · 2026-11-27"};
  }
  if(l.includes("comprador")||l.includes("compatible")){
    const p=prodById("L-001");
    const r=DB.buyers.map(b=>({b,m:buyerMatch(b,p)})).sort((a,b)=>b.m.score-a.m.score).slice(0,3);
    return {r:"a",t:`Para <b>${p.name}</b>, los más compatibles: ${r.map(x=>`<b>${x.b.name}</b> (${x.m.score}/100, ${x.b.status.toLowerCase()})`).join(", ")}. El primero coincide en tipo de producto, segmento y rango de precio. <br><span class="mini">${r.some(x=>!x.b.verified)?"Ojo: algunos son potenciales no verificados — falta validar contacto y volumen.":""}</span>`,
      prov:"Fuente: Buyer Match Score sobre compradores DEMO"};
  }
  if(l.includes("estancad")||l.includes("seguimiento")||l.includes("tiempo")&&l.includes("cicl")===false&&l.includes("pierd")===false){
    const stale=DB.opps.filter(o=>staleDays(o)>=7);
    return {r:"a",t:stale.length?`Hay <b>${stale.length}</b> oportunidad(es) estancada(s): ${stale.map(o=>{const b=buyerById(o.buyer);return `<b>${o.id}</b> (${b.name}, ${staleDays(o)} días, «${o.stage}»)`}).join("; ")}. Recomiendo programar seguimiento inmediato en la de mayor valor.`:"No hay oportunidades estancadas ahora mismo.",
      prov:"Fuente: pipeline DEMO · regla: ≥7 días sin actividad"};
  }
  if(l.includes("verde")||l.includes("tostado")){
    return {r:"a",t:`Depende de los costos, no hay respuesta fija. En el escenario base DEMO, el <b>tostado en grano</b> da mejor margen de contribución (~${quote({...Q,materiaPrima:7.1,transformacion:1.3,merma:16,precioVenta:14.2}).mContribPct.toFixed(0)}%) que el verde, <b>pero</b> exige más capital y asume 16% de merma. Si el precio de venta del tostado baja o sube la merma, el verde puede ganar. Usa el comparador en «Cotizador».`,
      prov:"Cálculo: motor de costos · supuestos editables por ti"};
  }
  if(l.includes("pierd")||l.includes("cuello")||l.includes("cicl")){
    return {r:"a",t:`El cuello de botella está en la etapa con más días promedio del ciclo. Revisa «Time to Market»: ahí el motor marca en rojo la etapa crítica y lista las oportunidades sin próxima tarea, que son la causa principal de retraso evitable.`,
      prov:"Fuente: eventos de ciclo DEMO · Time to Market"};
  }
  return {r:"a",t:`No tengo información suficiente registrada para responder eso con certeza. Puedo ayudarte con: priorización de mercados, compatibilidad de compradores, oportunidades estancadas, comparador verde/tostado o cuellos de botella del ciclo. ¿Reformulamos?`,
    prov:"El asistente reconoce cuándo no hay datos suficientes."};
}

  ];
  let html=`
  <div class="note"><span class="i">ℹ️</span><div>Arquitectura de conectores desacoplados. Cada fuente declara método, frecuencia, estado y confiabilidad. Mientras no haya API conectada, se importa por CSV/Excel con trazabilidad. <b>Nunca</b> se presenta un dato demo como real.</div></div>
  <div class="card" style="margin-top:14px">
    <h3>Fuentes de datos e integraciones</h3>
    <table><thead><tr><th>Fuente</th><th>Tipo de información</th><th>Método</th><th>Estado</th><th>Confiabilidad</th><th>Clasificación</th></tr></thead>
    <tbody>${sources.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td>
      <td>${s[3]==="Activa"?'<span class="pill g">Activa</span>':'<span class="pill n">No conectada</span>'}</td>
      <td>${s[4]}</td><td>${classPill(s[5])}</td></tr>`).join("")}</tbody></table>
  </div>
  <div class="card" style="margin-top:14px">
    <h3>Clasificación de todo dato en la plataforma</h3>
    <div class="legend" style="font-size:12.5px;gap:16px">
      <span>${flag("real","REAL")} verificado de fuente</span>
      <span>${flag("demo","DEMO")} demostración</span>
      <span>${flag("calc","CALCULADO")} derivado por la plataforma</span>
      <span>${flag("est","ESTIMADO")} supuesto del usuario</span>
    </div>
    <div class="mini" style="margin-top:10px">Cada cifra del producto lleva su etiqueta de origen para que nunca confundas un dato real con una estimación o una demostración.</div>
  </div>`;
  $("#view").innerHTML=html;
};
function classPill(c){const m={"Oficial":"b","Empresa":"g","Demo":"a"};return `<span class="pill ${m[c]||'n'}">${c}</span>`;}
function flag(c,t){return `<span class="flag ${c}">${t}</span>`;}

/* ---------- BOOT ---------- */
renderNav();
go("home");
</script>
</body>
</html>
